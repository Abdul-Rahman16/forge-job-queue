services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://forge:forge@db:5432/forge
    depends_on:
      - db
    volumes:
      - .:/app

  worker:
    build: .
    command: python -m workers.worker
    environment: 
      DATABASE_URL: postgresql://forge:forge@db:5432/forge
      PYTHONUNBUFFERED: 1
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata: